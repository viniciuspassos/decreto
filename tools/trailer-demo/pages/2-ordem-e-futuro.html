<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Ordem e Futuro — demo v0</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<!--
  Trailer 2 "Ordem e Futuro" (assets/trailers/2-ordem-e-futuro.md) comprimido em 10 s.
  Demo v0: sem IA. Tudo é desenhado a partir de demo.render(t), sem relógio próprio, para que o
  gravador (tools/trailer-demo) capture quadro a quadro de forma determinística.
  Aberto direto no navegador, roda em loop. ?lang=en troca o idioma da interface.
-->
<style>
  :root {
    --bg: #1e2b3c; --bg-raised: #2a3a4f; --line: #3b4b60; --text: #e8edf3; --muted: #8a9bb0;
    --accent: #9cc0e8; --right: #e8cf9c; --ok: #7fd49a;
    --display: "Barlow Condensed", sans-serif; --body: "Barlow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--body); }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* Gabinete + monitor */
  #rig { position: absolute; inset: 0; transform-origin: 960px 440px; }
  #wall { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #1a2533 0%, #070a0f 70%); }
  #desk { position: absolute; left: 0; right: 0; top: 880px; bottom: 0;
    background: linear-gradient(#3a2618, #1c120b); }
  #bezel { position: absolute; left: 310px; top: 60px; width: 1300px; height: 780px; border-radius: 18px;
    background: #101317; box-shadow: 0 0 120px rgba(156,192,232,.25), inset 0 0 0 2px #22272e; }
  #screen { position: absolute; left: 20px; top: 20px; width: 1260px; height: 720px; overflow: hidden;
    background: var(--bg); color: var(--text); border-radius: 6px; }
  #screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.08) 3px 4px); }
  #stand { position: absolute; left: 900px; top: 840px; width: 120px; height: 50px; background: #0c0e11; }
  .hand { position: absolute; top: 930px; width: 260px; height: 190px; border-radius: 48% 48% 30% 30%;
    background: radial-gradient(ellipse at 50% 0%, #6d5a4c 0%, #3a2c22 55%, #1d1510 100%);
    box-shadow: 0 -6px 30px rgba(156,192,232,.18); }
  #hand-l { left: 560px; transform: rotate(8deg); }
  #hand-r { left: 1100px; transform: rotate(-8deg); }

  .topbar { display: flex; align-items: center; gap: 28px; height: 80px; padding: 0 32px;
    border-bottom: 1px solid var(--line); font-family: var(--display); }
  .logo { font-size: 34px; font-weight: 700; letter-spacing: .14em; }
  .sep { border-left: 1px solid var(--line); padding-left: 28px; color: var(--muted); font-size: 22px;
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .capital { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--muted);
    font-size: 20px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .capital .bar { width: 260px; height: 8px; background: var(--line); position: relative; }
  .capital .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  #graph { position: absolute; left: 0; top: 80px; width: 1260px; height: 640px; }
  #graph text { font-family: var(--body); font-size: 17px; fill: var(--muted); text-anchor: middle; }
  #graph text.lit { fill: var(--text); }
  #utopia { position: absolute; inset: 80px 0 0 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(15,22,32,.82); opacity: 0; }
  #utopia h1 { margin: 10px 0; font-family: var(--display); font-weight: 700; font-size: 120px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--text); text-shadow: 0 0 40px rgba(156,192,232,.6); }
  #utopia .name { font-family: var(--display); font-size: 34px; letter-spacing: .2em; color: var(--accent);
    text-transform: uppercase; }

  #flat3d { position: absolute; left: -1000px; top: 560px; width: 3920px; height: 2600px;
    transform-origin: 50% 0%; }
  #sunset-sky { position: absolute; inset: 0;
    background: linear-gradient(#3b2a5c 0%, #c4566a 30%, #f29a5c 46%, #ffd28a 52%, #ffd28a 53%); }
  #sun { position: absolute; left: 860px; top: 420px; width: 200px; height: 200px; border-radius: 50%;
    background: #ffe9b8; box-shadow: 0 0 160px 60px rgba(255,200,120,.6); }
  #sunset-glow { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(255,170,90,0) 50%, rgba(255,140,80,.25) 75%, rgba(60,20,60,.45) 100%); }
  #window-frame { position: absolute; inset: 0; pointer-events: none; transform-origin: 960px 540px; }
</style>
</head>
<body>
<div id="stage">

  <!-- Gabinete e monitor: planos 2.1, 2.2, 2.3 (cliques), 2.5 e 2.10 -->
  <section class="scene" id="s-monitor">
    <div id="rig">
      <div id="wall"></div>
      <div id="desk"></div>
      <div id="stand"></div>
      <div id="bezel">
        <div id="screen">
          <div class="topbar">
            <span class="logo">DECRETO</span>
            <span class="sep" data-i18n="term"></span>
            <span class="sep" data-i18n="approval"></span>
            <span class="capital"><span data-i18n="capital"></span><span class="bar"><i id="capital-fill"></i></span></span>
          </div>
          <svg id="graph" viewBox="0 0 1260 640"></svg>
          <div id="utopia">
            <h1 data-i18n="utopia"></h1>
            <span class="name" data-i18n="nation"></span>
          </div>
        </div>
      </div>
      <div class="hand" id="hand-l"></div>
      <div class="hand" id="hand-r"></div>
    </div>
  </section>

  <!-- 2.1 Terminal entrega o cartão -->
  <section class="scene" id="s-terminal">
    <svg viewBox="0 0 1920 1080">
      <defs>
        <linearGradient id="g-hall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f6f8" /><stop offset="1" stop-color="#dfe5ea" />
        </linearGradient>
        <g id="person">
          <rect x="-46" y="-10" width="92" height="230" rx="40" fill="#7d8fa3" />
          <circle cx="0" cy="-60" r="44" fill="#d9b99b" />
        </g>
      </defs>
      <rect width="1920" height="1080" fill="url(#g-hall)" />
      <rect y="820" width="1920" height="260" fill="#cfd7de" />
      <g id="queue" opacity=".85"></g>
      <g transform="translate(560 300)">
        <rect width="300" height="560" rx="26" fill="#ffffff" stroke="#c8d1da" stroke-width="4" />
        <rect x="40" y="50" width="220" height="150" rx="10" fill="#a8e2bf" id="kiosk-screen" />
        <rect x="70" y="300" width="160" height="16" rx="8" fill="#4a5a6c" />
        <rect id="card" x="85" y="300" width="130" height="80" rx="8" fill="#5a7fa6" />
      </g>
      <g transform="translate(1040 560) scale(1.5)">
        <use href="#person" />
        <rect x="-30" y="-15" width="0" height="0" />
        <path id="smile" d="M -16 -44 Q 0 -30 16 -44" stroke="#5b3a2a" stroke-width="5" fill="none" stroke-linecap="round" />
        <circle cx="-15" cy="-66" r="4" fill="#3a2a22" /><circle cx="15" cy="-66" r="4" fill="#3a2a22" />
      </g>
    </svg>
  </section>

  <!-- 2.2 Muro branco entre colinas, amanhecer -->
  <section class="scene" id="s-wall">
    <svg viewBox="0 0 1920 1080">
      <defs>
        <linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a9c4e0" /><stop offset=".55" stop-color="#f6d2b8" /><stop offset=".7" stop-color="#ffe6c4" />
        </linearGradient>
      </defs>
      <g id="wall-cam">
        <rect width="1920" height="1080" fill="url(#g-dawn)" />
        <circle cx="1320" cy="560" r="70" fill="#fff4dc" opacity=".95" />
        <path d="M0 640 Q 400 520 900 610 T 1920 580 V1080 H0Z" fill="#9cc79a" />
        <path d="M0 720 Q 500 640 1000 700 T 1920 680 V1080 H0Z" fill="#7fb37f" />
        <path d="M-50 700 Q 500 610 1000 670 T 1970 640 L1970 590 Q 1500 610 1000 620 T -50 650Z" fill="#fbfbf9" />
        <path d="M-50 700 Q 500 610 1000 670 T 1970 640 L1970 655 Q 1500 670 1000 685 T -50 715Z" fill="#d9dcd8" />
        <g id="wall-posts"></g>
        <path d="M0 860 Q 600 780 1100 840 T 1920 800 V1080 H0Z" fill="#5f9a62" />
      </g>
    </svg>
  </section>

  <!-- 2.3 Bairro de casas idênticas -->
  <section class="scene" id="s-houses">
    <svg viewBox="0 0 1920 1080">
      <defs>
        <g id="house">
          <rect x="0" y="80" width="200" height="150" fill="#fbfbf8" />
          <path d="M-14 86 L100 0 L214 86Z" fill="#b65e4c" />
          <rect x="80" y="160" width="40" height="70" fill="#5a7fa6" />
          <rect x="24" y="115" width="38" height="34" fill="#cfe3f2" /><rect x="138" y="115" width="38" height="34" fill="#cfe3f2" />
        </g>
        <g id="kid">
          <rect x="-18" y="0" width="36" height="80" rx="14" fill="#2e4a6e" />
          <circle cx="0" cy="-20" r="18" fill="#d9b99b" />
        </g>
      </defs>
      <rect width="1920" height="1080" fill="#cfe4f3" />
      <g id="houses-row"></g>
      <rect y="600" width="1920" height="480" fill="#8cc47e" />
      <g id="lawn-stripes"></g>
      <rect y="760" width="1920" height="40" fill="#e8e6df" />
      <g id="kids-row"></g>
    </svg>
  </section>

  <!-- 2.4 Escola: hino diante da bandeira, painéis solares -->
  <section class="scene" id="s-school">
    <svg viewBox="0 0 1920 1080">
      <rect width="1920" height="1080" fill="#d6e8f5" />
      <path d="M260 330 L1660 330 L1560 230 L360 230Z" fill="#33507a" />
      <g id="solar"></g>
      <rect x="260" y="330" width="1400" height="330" fill="#f3efe6" />
      <g id="school-windows"></g>
      <rect y="660" width="1920" height="420" fill="#c9c2b2" />
      <rect x="955" y="140" width="10" height="560" fill="#8a8f96" />
      <g id="flag" transform="translate(965 150)">
        <rect width="260" height="160" fill="#f7f7f2" />
        <rect y="60" width="260" height="40" fill="#3e8e5a" />
        <circle cx="130" cy="80" r="34" fill="#f7f7f2" stroke="#3e8e5a" stroke-width="10" />
      </g>
      <g id="pupils"></g>
    </svg>
  </section>

  <!-- 2.6 Da janela para a cidade simétrica -->
  <section class="scene" id="s-city">
    <svg viewBox="0 0 1920 1080">
      <g id="city-cam"><g id="city"></g></g>
    </svg>
    <svg id="window-frame" viewBox="0 0 1920 1080">
      <path fill="#06090d" fill-rule="evenodd" d="M0 0H1920V1080H0Z M560 140H1360V940H560Z" />
      <rect x="950" y="140" width="20" height="800" fill="#06090d" />
      <rect x="560" y="530" width="800" height="20" fill="#06090d" />
    </svg>
  </section>

  <!-- 2.7 Votação no celular, barra verde no telão -->
  <section class="scene" id="s-vote">
    <svg viewBox="0 0 1920 1080">
      <rect width="1920" height="1080" fill="#e9eef2" />
      <rect x="0" y="560" width="1920" height="520" fill="#cdd5dc" />
      <rect x="560" y="80" width="800" height="420" rx="10" fill="#1d2733" />
      <rect x="620" y="270" width="680" height="44" rx="6" fill="#33414f" />
      <rect id="vote-bar" x="620" y="270" width="0" height="44" rx="6" fill="#4fd17a" />
      <rect x="930" y="500" width="60" height="120" fill="#9aa5b0" />
      <g id="phones"></g>
    </svg>
  </section>

  <!-- 2.8 Família à mesa; quadro do líder fora de foco -->
  <section class="scene" id="s-family">
    <svg viewBox="0 0 1920 1080">
      <defs>
        <filter id="blur-leader"><feGaussianBlur stdDeviation="14" /></filter>
        <g id="diner">
          <rect x="-70" y="0" width="140" height="260" rx="56" fill="#8a9bb0" />
          <circle cx="0" cy="-70" r="62" fill="#d9b99b" />
          <g class="eyes"><circle cx="-22" cy="-80" r="6" fill="#3a2a22" /><circle cx="22" cy="-80" r="6" fill="#3a2a22" /></g>
          <path d="M -24 -48 Q 0 -26 24 -48" stroke="#5b3a2a" stroke-width="6" fill="none" stroke-linecap="round" />
        </g>
      </defs>
      <g id="family-cam">
        <rect width="1920" height="1080" fill="#ece5d8" />
        <rect x="810" y="90" width="300" height="370" fill="#b9975e" />
        <rect x="830" y="110" width="260" height="330" fill="#6e7f8f" />
        <g filter="url(#blur-leader)">
          <circle cx="960" cy="240" r="62" fill="#1d2430" />
          <path d="M840 440 Q 960 300 1080 440Z" fill="#1d2430" />
        </g>
        <g id="diners"></g>
        <rect x="200" y="740" width="1520" height="60" fill="#7a5233" />
        <rect x="160" y="780" width="1600" height="300" fill="#5e3d25" />
        <g id="plates"></g>
      </g>
    </svg>
  </section>

  <!-- 2.9 Plano aéreo ao pôr do sol; a câmera não para de subir -->
  <section class="scene" id="s-aerial">
    <div id="sunset-sky"></div>
    <div id="sun"></div>
    <div id="flat3d"><svg viewBox="0 0 3920 2600" preserveAspectRatio="none"><g id="fields"></g></svg></div>
    <div id="sunset-glow"></div>
  </section>

  <div id="vignette"></div>
</div>

<script>
  const STRINGS = {
    "pt-BR": {
      term: "Ano 3 · 2º semestre", approval: "Aprovação 97%", capital: "Capital",
      utopia: "Utopia instalada", nation: "A Nação Concórdia",
      renda: "Renda básica", saude: "Saúde e educação grátis", moradia: "Moradia para todos",
      eco: "Transição ecológica", muro: "Muro na fronteira", familia: "Família tradicional",
      hino: "Hino diário", imposto: "Zero imposto", root: "Constituição",
      lMax: "Fim da pobreza", rMax: "Ordem e disciplina",
    },
    en: {
      term: "Year 3 · 2nd half", approval: "Approval 97%", capital: "Capital",
      utopia: "Utopia achieved", nation: "The Concord Nation",
      renda: "Basic income", saude: "Free health & education", moradia: "Housing for all",
      eco: "Green transition", muro: "Border wall", familia: "Traditional family",
      hino: "Daily anthem", imposto: "Zero corporate tax", root: "Constitution",
      lMax: "End of poverty", rMax: "Law and order",
    },
  };
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pt-BR";
  const T = STRINGS[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[el.dataset.i18n]; });

  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const el = (parent, tag, attrs) => {
    const node = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    parent.appendChild(node);
    return node;
  };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
  const lerp = (a, b, x) => a + (b - a) * x;

  /* ---------- Grafo de políticas: duas árvores espelhadas a partir do centro ---------- */
  const NODES = {
    root: [630, 330, null, "both"],
    renda: [430, 200, "root", "l"], saude: [220, 130, "renda", "l"], lMax: [70, 240, "saude", "l"],
    moradia: [430, 460, "root", "l"], eco: [220, 530, "moradia", "l"],
    muro: [830, 200, "root", "r"], familia: [1040, 130, "muro", "r"], rMax: [1190, 240, "familia", "r"],
    hino: [830, 460, "root", "r"], imposto: [1040, 530, "hino", "r"],
  };
  const graph = $("graph");
  const gEdges = el(graph, "g", {});
  const gNodes = el(graph, "g", {});
  const nodeEls = {};
  for (const [id, [x, y, parent]] of Object.entries(NODES)) {
    const edge = parent ? el(gEdges, "line", { x1: NODES[parent][0], y1: NODES[parent][1], x2: x, y2: y, "stroke-width": 3 }) : null;
    const ring = el(gNodes, "circle", { cx: x, cy: y, r: 22, fill: "none", "stroke-width": 3 });
    const dot = el(gNodes, "circle", { cx: x, cy: y, r: id === "root" ? 26 : 20, "stroke-width": 3 });
    const label = el(gNodes, "text", { x, y: y + 50 });
    label.textContent = T[id];
    nodeEls[id] = { edge, ring, dot, label };
  }
  const cursor = el(graph, "path", {
    d: "M0 0 L0 30 L8 23 L14 37 L19 35 L13 21 L24 21Z", fill: "#fff", stroke: "#000", "stroke-width": 1.5,
  });
  const colorOf = (id) => (NODES[id][3] === "r" ? "var(--right)" : "var(--accent)");

  function paintNode(id, lit, flash) {
    const n = nodeEls[id];
    const c = lit ? colorOf(id) : "var(--line)";
    n.dot.setAttribute("fill", lit ? c : "var(--bg-raised)");
    n.dot.setAttribute("stroke", c);
    n.dot.style.filter = lit ? `drop-shadow(0 0 ${10 + 20 * flash}px ${lit ? c : "transparent"})` : "none";
    n.label.setAttribute("class", lit ? "lit" : "");
    if (n.edge) n.edge.setAttribute("stroke", lit ? c : "var(--line)");
    n.ring.setAttribute("r", 22 + 50 * flash);
    n.ring.setAttribute("stroke", c);
    n.ring.setAttribute("opacity", flash > 0 ? 1 - flash : 0);
  }

  /* Estado do monitor num instante: nós acesos, clique, cursor, capital, câmera, utopia. */
  function paintMonitor(s) {
    for (const id of Object.keys(NODES)) {
      const clicked = id === s.click;
      const lit = s.lit.includes(id) || (clicked && s.clickP >= 0.7);
      paintNode(id, lit, clicked && s.clickP >= 0.7 ? seg(s.clickP, 0.7, 1) : 0);
    }
    const [x, y] = s.cursor;
    cursor.setAttribute("transform", `translate(${x} ${y})`);
    cursor.style.display = s.cursorHidden ? "none" : "";
    $("capital-fill").style.width = `${s.capital * 100}%`;
    $("rig").style.transform = `scale(${s.zoom})`;
    $("utopia").style.opacity = s.utopia;
  }

  function clickShot(target, from, lit, capital) {
    return (p) => {
      const move = ease(seg(p, 0.1, 0.65));
      const [tx, ty] = NODES[target];
      paintMonitor({
        lit, click: target, clickP: p, capital: lerp(capital, capital + 0.12, seg(p, 0.7, 1)),
        cursor: [lerp(from[0], tx, move), lerp(from[1], ty, move)], zoom: lerp(1.2, 1.25, p), utopia: 0,
      });
    };
  }
  const ALL = Object.keys(NODES);

  /* ---------- Cenas desenhadas uma vez ---------- */
  for (let i = 0; i < 6; i++) {
    el($("queue"), "use", { href: "#person", transform: `translate(${1300 + i * 120} ${520 - i * 6}) scale(${1.1 - i * 0.08})` });
  }
  for (let i = 0; i < 9; i++) {
    el($("wall-posts"), "rect", { x: i * 240 - 20, y: 560 + Math.sin(i) * 12, width: 14, height: 70, fill: "#e9ebe8" });
  }
  for (let i = 0; i < 12; i++) el($("houses-row"), "use", { href: "#house", x: i * 260 - 60, y: 380 });
  for (let i = 0; i < 24; i++) {
    el($("lawn-stripes"), "rect", { x: i * 90, y: 600, width: 45, height: 160, fill: "#9fd08f", opacity: 0.6 });
  }
  const kids = [];
  for (let i = 0; i < 8; i++) kids.push(el($("kids-row"), "use", { href: "#kid", x: 300 + i * 110, y: 880 }));
  for (let i = 0; i < 14; i++) {
    el($("solar"), "path", { d: `M${380 + i * 85} 320 L${450 + i * 85} 320 L${430 + i * 85} 245 L${370 + i * 85} 245Z`, fill: "#4e7fc2", stroke: "#9cc0e8", "stroke-width": 2 });
  }
  for (let i = 0; i < 8; i++) el($("school-windows"), "rect", { x: 320 + i * 170, y: 400, width: 100, height: 120, fill: "#b9d3e6" });
  const pupils = [];
  for (let row = 0; row < 2; row++) {
    for (let i = 0; i < 11; i++) {
      const g = el($("pupils"), "g", {});
      el(g, "rect", { x: -30, y: 0, width: 60, height: 150, rx: 24, fill: "#2e4a6e" });
      el(g, "circle", { cx: 0, cy: -34, r: 30, fill: "#3b2a20" });
      pupils.push({ g, x: 260 + i * 140 + row * 70, y: 820 + row * 120 });
    }
  }

  /* Cidade vista de cima, simétrica em torno do centro (960, 540). */
  const city = $("city");
  el(city, "rect", { x: -2000, y: -2000, width: 5920, height: 5080, fill: "#bcd9b0" });
  for (let gx = -12; gx <= 12; gx++) {
    for (let gy = -8; gy <= 8; gy++) {
      if (gx === 0 || gy === 0 || Math.abs(gx) === Math.abs(gy)) continue;
      const green = (Math.abs(gx) + Math.abs(gy)) % 5 === 0;
      el(city, "rect", { x: 960 + gx * 120 - 46, y: 540 + gy * 120 - 46, width: 92, height: 92, rx: 8, fill: green ? "#8fc485" : "#f4f2ec" });
    }
  }
  for (let r = 1; r <= 3; r++) el(city, "circle", { cx: 960, cy: 540, r: r * 260, fill: "none", stroke: "#e2e6e9", "stroke-width": 14 });
  el(city, "circle", { cx: 960, cy: 540, r: 90, fill: "#8fc485", stroke: "#f4f2ec", "stroke-width": 16 });
  el(city, "line", { x1: -2000, y1: 600, x2: 3920, y2: 600, stroke: "#8a96a3", "stroke-width": 6 });
  el(city, "line", { x1: 1020, y1: -2000, x2: 1020, y2: 3080, stroke: "#8a96a3", "stroke-width": 6 });
  const trainH = el(city, "rect", { y: 590, width: 260, height: 20, rx: 10, fill: "#ffffff" });
  const trainV = el(city, "rect", { x: 1010, width: 20, height: 260, rx: 10, fill: "#ffffff" });
  const drones = [];
  for (let i = 0; i < 6; i++) {
    const g = el(city, "g", {});
    el(g, "circle", { r: 28, fill: "#000", opacity: 0.12, cx: 14, cy: 20 });
    el(g, "circle", { r: 14, fill: "#2b3440" });
    drones.push({ g, a: (i / 6) * Math.PI * 2 });
  }

  const phones = [];
  for (let i = 0; i < 7; i++) {
    const g = el($("phones"), "g", { transform: `translate(${170 + i * 260} 760)` });
    el(g, "ellipse", { cx: 60, cy: 300, rx: 110, ry: 160, fill: "#c49a7c" });
    el(g, "rect", { x: 0, y: 40, width: 120, height: 220, rx: 18, fill: "#1b2028" });
    phones.push(el(g, "rect", { x: 10, y: 54, width: 100, height: 190, rx: 10, fill: "#2c3440" }));
  }

  const eyes = [];
  [460, 780, 1140, 1460].forEach((x) => {
    const u = el($("diners"), "g", { transform: `translate(${x} 560)` });
    const d = $("diner").cloneNode(true);
    d.removeAttribute("id");
    u.appendChild(d);
    eyes.push(d.querySelector(".eyes"));
    el($("plates"), "ellipse", { cx: x, cy: 772, rx: 90, ry: 20, fill: "#f4f2ec" });
  });

  const FIELD_COLORS = ["#c9a64a", "#8fb35a", "#a7c46a", "#6f9a4f", "#d4b86a"];
  for (let gx = 0; gx < 40; gx++) {
    for (let gy = 0; gy < 26; gy++) {
      const town = (gx % 9 === 4 && gy % 7 === 3);
      el($("fields"), "rect", { x: gx * 98, y: gy * 100, width: 94, height: 96,
        fill: town ? "#f2ead8" : FIELD_COLORS[(gx * 7 + gy * 3) % FIELD_COLORS.length] });
    }
  }
  el($("fields"), "rect", { x: 1940, y: 0, width: 40, height: 2600, fill: "#e9e2d0" });
  el($("fields"), "rect", { x: 0, y: 1300, width: 3920, height: 40, fill: "#e9e2d0" });

  /* ---------- Planos (corte seco entre eles; os cortes encurtam até 2.9) ---------- */
  const SHOTS = [
    // 2.1 Clique em Renda básica → terminal
    [0.0, 1.1, "s-monitor", clickShot("renda", [630, 600], ["root"], 0.4)],
    [1.1, 1.9, "s-terminal", (p) => {
      $("card").setAttribute("y", lerp(300, 380, ease(seg(p, 0.05, 0.6))));
      $("smile").setAttribute("d", `M -16 -44 Q 0 ${lerp(-40, -26, ease(seg(p, 0.45, 0.9)))} 16 -44`);
      $("s-terminal").querySelector("svg").style.transform = `scale(${lerp(1, 1.05, p)})`;
    }],
    // 2.2 Clique em Muro na fronteira → muro ao amanhecer
    [1.9, 2.6, "s-monitor", clickShot("muro", [430, 200], ["root", "renda"], 0.52)],
    [2.6, 3.3, "s-wall", (p) => {
      $("wall-cam").setAttribute("transform", `translate(960 600) scale(${lerp(1, 1.08, p)}) translate(-960 -600)`);
    }],
    // 2.3 Clique em Moradia para todos → bairro idêntico
    [3.3, 3.85, "s-monitor", clickShot("moradia", [830, 200], ["root", "renda", "muro"], 0.64)],
    [3.85, 4.5, "s-houses", (p) => {
      $("houses-row").setAttribute("transform", `translate(${lerp(0, -120, p)} 0)`);
      kids.forEach((k, i) => k.setAttribute("x", 300 + i * 110 + lerp(0, 160, p)));
    }],
    // 2.4 Escola: hino, painéis solares
    [4.5, 5.1, "s-school", (p) => {
      $("flag").setAttribute("transform", `translate(965 150) skewY(${Math.sin(p * 9) * 3})`);
      const bob = Math.abs(Math.sin(p * 14)) * 6;
      pupils.forEach((u) => u.g.setAttribute("transform", `translate(${u.x} ${u.y - bob})`));
    }],
    // 2.5 Grafo aceso dos dois lados, capital no máximo
    [5.1, 5.8, "s-monitor", (p) => {
      paintMonitor({ lit: ALL, click: null, clickP: 0, capital: 1, cursor: [0, 0], cursorHidden: true,
        zoom: lerp(1.35, 1.45, p), utopia: 0 });
      ALL.forEach((id) => { nodeEls[id].dot.style.filter = `drop-shadow(0 0 ${14 + 10 * Math.sin(p * 12)}px ${colorOf(id)})`; });
    }],
    // 2.6 Câmera sai pela janela e chega à cidade
    [5.8, 7.0, "s-city", (p) => {
      const rise = ease(p);
      $("window-frame").style.transform = `scale(${lerp(1, 3.4, ease(seg(p, 0, 0.5)))})`;
      $("window-frame").style.opacity = 1 - seg(p, 0.35, 0.5);
      $("city-cam").setAttribute("transform", `translate(960 540) scale(${lerp(2.4, 0.9, rise)}) translate(-960 -540)`);
      trainH.setAttribute("x", lerp(-600, 1800, p));
      trainV.setAttribute("y", lerp(1400, -300, p));
      drones.forEach((d) => {
        const a = d.a + p * 1.2;
        d.g.setAttribute("transform", `translate(${960 + Math.cos(a) * 380} ${540 + Math.sin(a) * 380})`);
      });
    }],
    // 2.7 Todos votam ao mesmo tempo; barra verde completa
    [7.0, 7.6, "s-vote", (p) => {
      phones.forEach((s) => s.setAttribute("fill", p > 0.15 ? "#4fd17a" : "#2c3440"));
      $("vote-bar").setAttribute("width", 680 * ease(seg(p, 0.2, 0.95)));
    }],
    // 2.8 Família sorri igual; ninguém fala; todos piscam juntos
    [7.6, 8.3, "s-family", (p) => {
      $("family-cam").setAttribute("transform", `translate(960 540) scale(${lerp(1, 1.06, p)}) translate(-960 -540)`);
      const blink = p > 0.55 && p < 0.65 ? 0.1 : 1;
      eyes.forEach((e) => e.setAttribute("transform", `translate(0 -80) scale(1 ${blink}) translate(0 80)`));
    }],
    // 2.9 Plano aéreo ao pôr do sol, subindo sempre
    [8.3, 9.0, "s-aerial", (p) => {
      $("flat3d").style.transform = `perspective(900px) rotateX(62deg) scale(${lerp(1.5, 0.95, p)})`;
      $("sun").style.transform = `translateY(${lerp(0, 30, p)}px)`;
    }],
    // 2.10 De volta ao gabinete: UTOPIA INSTALADA; as mãos não se mexem
    [9.0, 10.0, "s-monitor", (p) => {
      paintMonitor({ lit: ALL, click: null, clickP: 0, capital: 1, cursor: [0, 0], cursorHidden: true,
        zoom: lerp(0.98, 1.0, p), utopia: seg(p, 0.1, 0.35) });
    }],
  ];
  const DURATION = 10;

  function render(t) {
    const shot = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
    const [a, b, sceneId, draw] = shot;
    document.querySelectorAll(".scene").forEach((s) => { s.style.display = s.id === sceneId ? "block" : "none"; });
    draw(clamp((t - a) / (b - a)));
  }

  window.demo = { duration: DURATION, render };
  render(0);
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = (now) => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
