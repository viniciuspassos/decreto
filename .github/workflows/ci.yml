name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decreto
          POSTGRES_USER: decreto
          POSTGRES_PASSWORD: decreto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decreto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://decreto:decreto@localhost:5432/decreto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available for diff-aware coverage
        run: git fetch origin main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Apply DB migrations
        run: pnpm --filter @decreto/api run db:migrate

      - run: pnpm turbo run typecheck lint test build

      - name: Diff-aware coverage gate
        run: pnpm diff-coverage origin/main
